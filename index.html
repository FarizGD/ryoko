<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080812">
  <title>RYŌKO — Rhythm Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <strong>RYŌKO</strong><span>凌鼓 · HTML5 Prototype</span>
      <button id="editorToggle">Chart Editor</button>
    </header>
    <section id="game" class="screen">
      <div class="hud"><div><span id="combo">0</span><small> COMBO</small></div><div id="score">000000</div><div id="health">♥♥♥♥♥</div></div>
      <div id="arena" aria-label="Rhythm play area"><div id="player">◆</div><div id="feedback">READY</div></div>
      <div class="controls"><button data-dir="left">←</button><button data-dir="up">↑</button><button data-dir="down">↓</button><button data-dir="right">→</button></div>
      <div class="transport"><button id="start">Start</button><button id="restart">Restart</button><span id="time">0:00.000</span></div>
    </section>
    <section id="editor" class="screen hidden">
      <div class="editor-head"><div><b>CHART EDITOR</b><span id="editorTime">0:00.000</span></div><div class="editor-tools"><label>BPM <input id="bpm" type="number" min="30" max="300" value="150"></label><select id="noteType"><option value="tap">Tap</option><option value="swipe">Swipe</option><option value="hold">Hold</option></select><select id="direction"><option value="up">↑ Up</option><option value="right">→ Right</option><option value="down">↓ Down</option><option value="left">← Left</option></select></div></div>
      <div id="timeline"><div id="grid"></div><div id="playhead"></div></div>
      <div class="editor-actions"><button id="editorPlay">▶ Play</button><button id="addNote">＋ Add Note</button><button id="deleteNote">Delete Selected</button><button id="exportChart">Export JSON</button><button id="importChart">Import JSON</button><input id="fileInput" type="file" accept="application/json" hidden></div>
      <p class="hint">Click the timeline to place a note. Drag notes to move them. Press Space to play/pause. Arrow keys test gameplay.</p>
    </section>
  </main>
  <script type="module" src="src/game.js"></script>
</body>
</html>
